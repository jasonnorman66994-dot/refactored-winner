# Zero-Trust Architecture Configuration

# Authentication settings
authentication:
  required_factors: 2
  session_timeout: 3600  # 1 hour in seconds
  min_trust_score: 0.5
  max_session_age: 3600

# Authorization settings
authorization:
  default_deny: true
  policy_cache_ttl: 300
  enable_wildcard_resources: true

# Verification settings
verification:
  rate_limit_requests: 50
  rate_limit_window: 60  # seconds
  max_payload_size: 1000000  # 1MB
  reverification_interval: 300  # 5 minutes

# Monitoring settings
monitoring:
  enable_audit_logging: true
  alert_on_failed_logins: 5
  alert_time_window: 300  # 5 minutes
  log_file: /var/log/zero-trust/audit.log

# Network segmentation settings
network:
  default_segment_type: PRIVATE
  enable_same_segment_bypass: true
  default_deny_all: true
